allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Older plugins (e.g. connectivity_plus 3.x) don't declare a namespace, which AGP 8 requires.
// Default it to the package from the plugin's AndroidManifest.xml; plugins that set
// their own namespace override this in their build.gradle.
subprojects { sub ->
    sub.plugins.withId('com.android.library') {
        def manifest = sub.file('src/main/AndroidManifest.xml')
        if (manifest.exists()) {
            def pkg = new groovy.xml.XmlSlurper().parse(manifest).@package.text()
            if (pkg) {
                sub.android.namespace = pkg
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
